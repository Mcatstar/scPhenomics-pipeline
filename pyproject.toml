[project]
name = "scPhenomics"
version = "0.1.0"
description = """
    General‑purpose single‑cell phenomics pipeline for multi‑channel fluorescence microscopy,
    forked & generalized from Kangs et al. (Nature Metabolism 2025).
"""
authors = [
    {name = "Mcatstar",email = "lyz_ouc@126.com"}
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "numpy (>= 1.21, < 2.4)",
    "pandas (>=3.0.5,<4.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "tqdm (>=4.70.0,<5.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "tifffile (>=2026.8.23,<2027.0.0)",
    "cellpose[gui] (<4.0)",
    "napari[pyside6, optional]",
    "loguru (>=0.7.3,<0.8.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.3,<5.0.0)",
    "jupyterlab-language-pack-zh-cn (>=4.5.post3,<5.0)"
]
